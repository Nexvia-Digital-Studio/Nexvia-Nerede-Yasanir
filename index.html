<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaşam Haritası — Türkiye'de Nerede Yaşarım?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --txt:#e2e8f0;
    --muted:#94a3b8; --accent:#3b82f6; --accent2:#60a5fa; --good:#22c55e;
    --warn:#eab308; --bad:#ef4444; --border:#334155;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--txt); overflow:hidden;
  }
  #app{display:flex; height:100vh; width:100vw;}

  /* SIDEBAR */
  #sidebar{
    width:380px; min-width:380px; height:100%; background:var(--panel);
    display:flex; flex-direction:column; border-right:1px solid var(--border); z-index:1000;
  }
  .sb-head{
    padding:16px 18px 12px; background:linear-gradient(135deg,#1e3a8a,#1e40af);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .sb-head h1{font-size:18px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
  .sb-head p{font-size:12px; color:var(--muted); margin-top:4px;}
  .sb-stats{
    display:flex; gap:8px; margin-top:10px; font-size:13px;
  }
  .stat-pill{
    flex:1; background:rgba(255,255,255,.08); padding:8px 10px; border-radius:8px; text-align:center;
  }
  .stat-pill b{display:block; font-size:18px; color:#fff;}
  .stat-pill span{font-size:11px; color:var(--muted);}
  .sb-actions{
    display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .btn{
    flex:1; padding:8px; border:1px solid var(--border); background:var(--panel2); color:var(--txt);
    border-radius:7px; cursor:pointer; font-size:12px; font-weight:600; transition:.15s;
  }
  .btn:hover{background:#475569;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .filters{flex:1; overflow-y:auto; padding:8px 12px 30px;}
  .filters::-webkit-scrollbar{width:8px;}
  .filters::-webkit-scrollbar-thumb{background:#475569; border-radius:4px;}
  .filters::-webkit-scrollbar-track{background:transparent;}

  .grp{margin-bottom:6px; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:rgba(255,255,255,.02);}
  .grp-head{
    display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer;
    font-weight:700; font-size:13px; user-select:none; background:rgba(255,255,255,.03);
  }
  .grp-head:hover{background:rgba(255,255,255,.07);}
  .grp-head .ico{font-size:15px;}
  .grp-head .chev{margin-left:auto; transition:.2s; color:var(--muted); font-size:12px;}
  .grp.open .chev{transform:rotate(90deg);}
  .grp-body{display:none; padding:8px 12px 12px;}
  .grp.open .grp-body{display:block;}

  .filter{margin-bottom:14px;}
  .filter:last-child{margin-bottom:4px;}
  .f-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .f-label{font-size:12px; font-weight:600; color:var(--txt);}
  .f-val{font-size:11px; color:var(--accent2); font-weight:600; background:rgba(59,130,246,.12); padding:2px 7px; border-radius:5px;}
  .f-val.default{color:var(--muted); background:rgba(148,163,184,.1);}

  /* dual range slider */
  .range-wrap{position:relative; height:24px;}
  .range-wrap input[type=range]{
    position:absolute; left:0; right:0; width:100%; top:6px; height:12px;
    pointer-events:none; -webkit-appearance:none; appearance:none; background:transparent; margin:0; z-index:3;
  }
  .range-wrap input[type=range]::-webkit-slider-thumb{
    pointer-events:auto; -webkit-appearance:none; appearance:none; width:16px; height:16px;
    border-radius:50%; background:#fff; border:2px solid var(--accent); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .range-wrap input[type=range]::-moz-range-thumb{
    pointer-events:auto; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--accent); cursor:pointer;
  }
  .range-track{position:absolute; top:10px; height:4px; width:100%; background:#475569; border-radius:2px; z-index:1;}
  .range-fill{position:absolute; height:100%; background:var(--accent); border-radius:2px;}

  /* tri switch */
  .tri{display:flex; gap:4px; background:#0f172a; border-radius:7px; padding:3px;}
  .tri button{
    flex:1; padding:6px 4px; border:none; background:transparent; color:var(--muted);
    font-size:11px; font-weight:600; border-radius:5px; cursor:pointer; transition:.15s;
  }
  .tri button.sel{background:var(--accent); color:#fff;}

  /* checkboxes */
  .checks{display:flex; flex-wrap:wrap; gap:6px;}
  .checks label{
    display:flex; align-items:center; gap:5px; font-size:11px; padding:5px 9px;
    background:#0f172a; border:1px solid var(--border); border-radius:6px; cursor:pointer; user-select:none;
  }
  .checks label:hover{border-color:var(--accent);}
  .checks input{accent-color:var(--accent);}

  .hint{font-size:10px; color:var(--muted); margin-top:-4px; margin-bottom:8px; line-height:1.4;}

  /* MAP */
  #map{flex:1; height:100%; background:#1a1a2e; z-index:1;}
  .leaflet-container{background:#0f172a;}

  /* custom marker */
  .city-marker{
    border-radius:50%; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .15s; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .city-marker:hover{transform:scale(1.25); z-index:9999;}

  /* popup */
  .leaflet-popup-content-wrapper{background:#1e293b; color:var(--txt); border-radius:10px; border:1px solid var(--border);}
  .leaflet-popup-tip{background:#1e293b;}
  .pop{min-width:240px; max-width:280px;}
  .pop h3{font-size:15px; margin-bottom:2px; display:flex; align-items:center; gap:6px;}
  .pop .region{font-size:11px; color:var(--accent2); margin-bottom:8px;}
  .pop .scorebar{margin:8px 0; background:#0f172a; border-radius:6px; height:8px; overflow:hidden;}
  .pop .scorefill{height:100%; border-radius:6px; transition:width .4s;}
  .pop .scoretxt{font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:4px;}
  .pop .grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:11px; margin-top:8px;}
  .pop .grid div{display:flex; justify-content:space-between; border-bottom:1px solid rgba(148,163,184,.15); padding:2px 0;}
  .pop .grid b{color:var(--txt); font-weight:600;}

  /* legend */
  .legend{
    position:absolute; bottom:16px; right:16px; background:rgba(30,41,59,.95); padding:10px 12px;
    border-radius:9px; border:1px solid var(--border); z-index:500; font-size:11px; backdrop-filter:blur(6px);
  }
  .legend h4{font-size:11px; margin-bottom:6px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .legend .row{display:flex; align-items:center; gap:7px; margin:3px 0;}
  .legend .dot{width:12px; height:12px; border-radius:50%; border:1.5px solid #fff;}

  /* mobile toggle */
  #toggleSb{
    position:absolute; top:14px; left:14px; z-index:1200; display:none;
    background:var(--panel); border:1px solid var(--border); color:#fff; width:42px; height:42px;
    border-radius:9px; font-size:18px; cursor:pointer;
  }
  @media(max-width:760px){
    #sidebar{position:absolute; left:0; top:0; transform:translateX(-100%); transition:.25s; box-shadow:4px 0 20px rgba(0,0,0,.5);}
    #sidebar.show{transform:translateX(0);}
    #toggleSb{display:block;}
  }
</style>
</head>
<body>
<div id="app">
  <button id="toggleSb">☰</button>

  <aside id="sidebar">
    <div class="sb-head">
      <h1>📍 Yaşam Haritası</h1>
      <p>Türkiye'de hangi il sana uygun? Filtrele, keşfet.</p>

</div>

/* ============================================================
   STATE
   ============================================================ */
let state = {};      // filter values
let strictMode = true;
const markers = {};

/* ============================================================
   ARAYÜZ KURULUMU
   ============================================================ */
function fmtNum(v, unit){
  if(unit==="bin") return (v>=1000? (v/1000).toFixed(v%1000?1:0)+"M" : v+"K");
  return v + (unit? " "+unit : "");
}
function fmtRange(f){
  const lo = state[f.key].min, hi = state[f.key].max;
  if(f.log){
    return fmtNum(lo,"bin")+" – "+fmtNum(hi,"bin");
  }
  return (f.type==="range" && lo===f.min && hi===f.max) ? "Tümü" : (lo+" – "+hi+(f.unit?" "+f.unit:""));
}

function buildFilters(){
  const cont = document.getElementById('filters');
  cont.innerHTML = "";
  FILTERS.forEach((g,gi)=>{
    const grp = document.createElement('div');
    grp.className = 'grp' + (g.open?' open':'');
    grp.innerHTML = `<div class="grp-head"><span class="ico">${g.grp.split(' ')[0]}</span><span>${g.grp.substring(g.grp.indexOf(' ')+1)}</span><span class="chev">▶</span></div>`;
    const body = document.createElement('div');
    body.className = 'grp-body';
    g.items.forEach(f=>{
      if(f.type==="range"){
        state[f.key] = {min:f.min, max:f.max};
        const fe = document.createElement('div');
        fe.className = 'filter';
        fe.innerHTML = `
          <div class="f-head"><span class="f-label">${f.label}</span><span class="f-val default" id="v_${f.key}">Tümü</span></div>
          ${f.hint?`<div class="hint">${f.hint}</div>`:''}
          <div class="range-wrap">
            <div class="range-track"><div class="range-fill" id="fill_${f.key}"></div></div>
            <input type="range" class="r-min" id="min_${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.min}">
            <input type="range" class="r-max" id="max_${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.max}">
          </div>`;
        body.appendChild(fe);
      } else if(f.type==="tri"){
        state[f.key] = 0;
        const fe = document.createElement('div');
        fe.className = 'filter';
        fe.innerHTML = `
          <div class="f-head"><span class="f-label">${f.label}</span></div>
          <div class="tri" id="tri_${f.key}">
            ${f.opts.map((o,i)=>`<button data-i="${i}" class="${i===0?'sel':''}">${o}</button>`).join('')}
          </div>`;
        body.appendChild(fe);
      } else if(f.type==="checks"){
        state[f.key] = new Set(f.opts);
        const fe = document.createElement('div');
        fe.className = 'filter';
        fe.innerHTML = `
          <div class="f-head"><span class="f-label">${f.label}</span></div>
          <div class="checks" id="chk_${f.key}">
            ${f.opts.map(o=>`<label><input type="checkbox" value="${o}" checked> ${o}</label>`).join('')}
          </div>`;
        body.appendChild(fe);
      }
    });
    grp.appendChild(body);
    grp.querySelector('.grp-head').addEventListener('click', ()=> grp.classList.toggle('open'));
    cont.appendChild(grp);
  });
  wireFilters();
}

function wireFilters(){
  FILTERS.forEach(g=>g.items.forEach(f=>{
    if(f.type==="range"){
      const minI=document.getElementById('min_'+f.key);
      const maxI=document.getElementById('max_'+f.key);
      const fill=document.getElementById('fill_'+f.key);
      const val=document.getElementById('v_'+f.key);
      const span=f.max-f.min;
      const upd=()=>{
        let lo=+minI.value, hi=+maxI.value;
        if(lo>hi- (f.step||1)){ if(this===minI) maxI.value=lo; else minI.value=hi; lo=+minI.value; hi=+maxI.value; }
        // overlap guard
        if(lo>hi){ [lo,hi]=[hi,lo]; }
        state[f.key]={min:lo,max:hi};
        const lp=(lo-f.min)/span*100, hp=(hi-f.min)/span*100;
        fill.style.left=lp+'%'; fill.style.width=(hp-lp)+'%';
        const isDef=(lo===f.min && hi===f.max);
        val.textContent=isDef?'Tümü':fmtRange(f);
        val.classList.toggle('default',isDef);
        update();
      };
      const updMin=()=>{ if(+minI.value>+maxI.value-(f.step||1)) minI.value=+maxI.value-(f.step||1); upd(); };
      const updMax=()=>{ if(+maxI.value<+minI.value+(f.step||1)) maxI.value=+minI.value+(f.step||1); upd(); };
      minI.addEventListener('input',updMin);
      maxI.addEventListener('input',updMax);
      // init fill
      fill.style.left='0%'; fill.style.width='100%';
    } else if(f.type==="tri"){
      const box=document.getElementById('tri_'+f.key);
      box.querySelectorAll('button').forEach(b=>{
        b.addEventListener('click',()=>{
          box.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');
          state[f.key]=+b.dataset.i;
          update();
        });
      });
    } else if(f.type==="checks"){
      const box=document.getElementById('chk_'+f.key);
      box.querySelectorAll('input').forEach(c=>{
        c.addEventListener('change',()=>{
          const s=new Set();
          box.querySelectorAll('input:checked').forEach(x=>s.add(x.value));
          state[f.key]=s;
          update();
        });
      });
    }
  }));
}

/* ============================================================
   FİLTRELEME & SKOR
   ============================================================ */
function evalCity(c){
  let activeFilters=0, passed=0;
  const reasons=[];
  FILTERS.forEach(g=>g.items.forEach(f=>{
    if(f.type==="range"){
      const v=c[f.key];
      const st=state[f.key];
      const isDef=(st.min===f.min && st.max===f.max);
      if(isDef) return; // pasif
      activeFilters++;
      if(v>=st.min && v<=st.max){ passed++; }
      else reasons.push(f.label);
    } else if(f.type==="tri"){
      if(state[f.key]===0) return; // farketmez
      activeFilters++;
      const want = state[f.key]===1?1:0;
      if(c[f.key]===want) passed++;
      else reasons.push(f.label);
    } else if(f.type==="checks"){
      const st=state[f.key];
      if(st.size===f.opts.length) return; // hepsi seçili = pasif
      activeFilters++;
      if(st.has(c[f.key])) passed++;
      else reasons.push(f.label);
    }
  }));
  const score = activeFilters===0 ? 100 : Math.round(passed/activeFilters*100);
  const eligible = activeFilters===0 ? true : (strictMode ? (passed===activeFilters) : true);
  return {score, passed, activeFilters, eligible, reasons};
}

function colorFor(score, eligible){
  if(strictMode && !eligible) return '#64748b';
  if(score>=80) return '#16a34a';
  if(score>=60) return '#84cc16';
  if(score>=40) return '#eab308';
  return '#94a3b8';
}

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © Carto', subdomains:'abcd', maxZoom:19
}).addTo(map);

function sizeFor(nufus){
  if(nufus>=10000) return 34;
  if(nufus>=3000) return 28;
  if(nufus>=1000) return 22;
  if(nufus>=400) return 18;
  if(nufus>=150) return 15;
  return 12;
}

CITIES.forEach(c=>{
  const size=sizeFor(c.nufus);
  const icon = L.divIcon({
    className:'',
    html:`<div class="city-marker" style="width:${size}px;height:${size}px;font-size:${Math.max(8,size/2.5)}px;background:#3b82f6">${c.name[0]}</div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
  const mk = L.marker([c.lat,c.lng],{icon}).addTo(map);
  markers[c.id]=mk;
  mk.on('click',()=>focusCity(c.id));
});

function popupHtml(c, res){
  const col=colorFor(res.score,res.eligible);
  const cls = c.deniz? '🌊 ':'';
  const rows = [
    ['Nüfus', fmtNum(c.nufus,'bin')],
    ['Bölge', c.bolge],
    ['Rakım', c.rakim+' m'],
    ['Deniz', c.deniz? 'Evet ('+c.denizMesafe+' km)' : (c.denizMesafe+' km')],
    ['Dağlık', c.daglik+'/10'],
    ['Yıllık sıc.', c.sicaklikOrt+' °C'],
    ['Kış / Yaz', c.kisSicaklik+'° / '+c.yazSicaklik+'°'],
    ['Yağış', c.yagis+' mm'],
    ['Güneş', c.gunes+' s/yıl'],
    ['Nem', c.nem+'%'],
    ['İş', c.isImkanlari+'/10'],
    ['Sağlık', c.saglik+'/10'],
    ['Eğitim', c.egitim+'/10'],
    ['Sosyal', c.sosyalYasam+'/10'],
    ['Ulaşım', c.ulasim+'/10'],
    ['İnternet', c.internet+' Mbps'],
    ['Maliyet', c.yasamMaliyeti+'/10'],
    ['Deprem', c.depremRiski+'/5'],
    ['Trafik', c.trafik+'/10'],
    ['Hava kal.', c.havaKalitesi+'/10'],
    ['Güvenlik', c.guvenlik+'/10'],
  ];
  const grid = rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  return `<div class="pop">
    <h3>${cls}${c.name}</h3>
    <div class="region">${c.bolge} • ${fmtNum(c.nufus,'bin')} nüfus</div>
    <div class="scoretxt"><span>Uyum skoru</span><b style="color:${col}">%${res.score} ${res.eligible?'':'(elendi)'}</b></div>
    <div class="scorebar"><div class="scorefill" style="width:${res.score}%;background:${col}"></div></div>
    ${res.reasons.length?`<div style="font-size:10px;color:var(--muted)">Uymayan: ${res.reasons.join(', ')}</div>`:''}
    <div class="grid">${grid}</div>
  </div>`;
}

/* ============================================================
   ANA GÜNCELLEME
   ============================================================ */
function update(){
  const results = CITIES.map(c=>({c, res:evalCity(c)}));
  // aktif filtre sayısı
  let activeCount=0;
  FILTERS.forEach(g=>g.items.forEach(f=>{
    if(f.type==="range"){ const st=state[f.key]; if(!(st.min===f.min&&st.max===f.max)) activeCount++; }
    else if(f.type==="tri"){ if(state[f.key]!==0) activeCount++; }
    else if(f.type==="checks"){ if(state[f.key].size!==f.opts.length) activeCount++; }
  }));
  document.getElementById('cntActive').textContent=activeCount;

  // markerları güncelle
  let matchCount=0, bestCount=0;
  results.forEach(({c,res})=>{
    const col=colorFor(res.score,res.eligible);
    const visible = !strictMode || res.eligible;
    const mk=markers[c.id];
    const size=sizeFor(c.nufus);
    const op = visible?1:0.25;
    mk.setOpacity(op);
    mk.setIcon(L.divIcon({
      className:'',
      html:`<div class="city-marker" style="width:${size}px;height:${size}px;font-size:${Math.max(8,size/2.5)}px;background:${col};opacity:${op}">${c.name[0]}</div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    }));
    mk.unbindPopup();
    mk.bindPopup(popupHtml(c,res));
    if(res.eligible) matchCount++;
    if(res.eligible && res.score>=80) bestCount++;
  });

  document.getElementById('cntMatch').textContent=matchCount;
  document.getElementById('cntBest').textContent=bestCount;
}

function focusCity(id){
  const c=CITIES.find(x=>x.id===id);
  map.flyTo([c.lat,c.lng],9,{duration:.8});
  setTimeout(()=>markers[id].openPopup(),500);
}

/* ============================================================
   KONTROLLER
   ============================================================ */
document.getElementById('btnReset').addEventListener('click',()=>{
  buildFilters();
  update();
});
document.getElementById('btnStrict').addEventListener('click',function(){
  strictMode=!strictMode;
  this.classList.toggle('active',strictMode);
  this.textContent = strictMode? '✔ Sadece uygun' : '⚎ Tümünü göster';
  update();
});
document.getElementById('toggleSb').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('show');
});

/* ============================================================
   BAŞLAT
   ============================================================ */
buildFilters();
update();
</script>
</body>
</html>
